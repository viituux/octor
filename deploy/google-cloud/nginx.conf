server {
    listen 80;
    server_name teste.octor.app.br;
    root /srv/octor/front/dist/octor/browser;
    index index.html;
    client_max_body_size 40m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        alias /srv/octor/back/staticfiles/;
    }

    location ~ ^/(api|admin)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
