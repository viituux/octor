<!DOCTYPE html>
<!-- Painel lateral da extensão: os controles disparam comandos; o worker mantém gravação e sessão, e este documento apresenta seu estado. -->

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/jpeg" href="octor-icon.jpg">
  <title>OCTOR — Captura</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="header">
    <a class="logo" data-octor-page="/guides" aria-label="Abrir biblioteca do OCTOR">
      <img src="octor-icon.jpg" alt="" width="34" height="34">
      <span>OCTOR</span>
    </a>
    <nav class="header-links" aria-label="Conta">
      <a data-octor-page="/notifications" aria-label="Notificações" title="Notificações"><span class="bell" aria-hidden="true"></span></a>
      <a data-octor-page="/account" aria-label="Configurações da conta" title="Configurações da conta">⚙</a>
    </nav>
    <div id="statusBadge" class="status-badge">Pronto</div>
  </div>

  <!-- Tela de Login -->
  <div id="authSection" class="hidden">
    <h1>Entre no OCTOR</h1>
    <div class="field">
      <label for="username">Usuário</label>
      <input type="text" id="username" placeholder="seu-usuario" />
    </div>
    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>
    <button id="btnLogin" class="btn btn-primary">Entrar</button>
    <button id="btnBrowserLogin" class="btn btn-secondary">Entrar pelo navegador / Google</button>
    <div id="authError" class="error-msg hidden" role="status"></div>
  </div>

  <!-- Tela do Gravador -->
  <div id="recorderSection" class="hidden">
    <div id="setupControls">
      <button id="btnStart" class="btn btn-record"><span class="capture-icon" aria-hidden="true"></span> Iniciar captura</button>
      <details class="capture-options">
        <summary>Opções de captura</summary>
        <div class="field">
          <label for="guideTitle">Título do guia</label>
          <input type="text" id="guideTitle" placeholder="Ex.: Criar uma fatura" value="Novo Guia">
        </div>
        <label class="microphone-option"><input type="checkbox" id="withMicrophone"> Gravar com microfone</label>
      </details>
    </div>

    <div id="activeControls" class="hidden">
      <div class="stats-card" role="status">
        <strong id="stepCounter" class="step-counter">0</strong>
        <span>Passos capturados</span>
      </div>
      <div class="btn-row">
        <button id="btnPause" class="btn btn-secondary">Pausar</button>
        <button id="btnFinish" class="btn btn-success">Finalizar</button>
      </div>
    </div>

    <button id="btnStopTutorial" class="btn btn-secondary hidden">Encerrar tutorial</button>
    <section id="playbackNarration" class="hidden" aria-labelledby="playbackNarrationTitle">
      <h3 id="playbackNarrationTitle">Narração do passo</h3>
      <p id="playbackNarrationStatus" role="status"></p>
      <audio id="playbackNarrationAudio" class="hidden" controls preload="metadata" aria-label="Narração do passo atual"></audio>
      <button id="btnRetryPlaybackNarration" type="button" class="btn btn-secondary hidden">Tentar carregar novamente</button>
    </section>
    <p id="voiceStatus" ></p>
    <button id="btnFinishSilent" class="btn btn-secondary hidden">Finalizar sem narração</button>
    <div id="recorderMsg" class="error-msg hidden" role="status"></div>

    <section class="library" aria-labelledby="libraryTitle">
      <h2 id="libraryTitle">Seus documentos</h2>
      <div class="library-card">
        <span class="document-icon" aria-hidden="true">☷</span>
        <p>Abra seus guias ou crie um manual a partir de uma URL.</p>
        <a class="btn btn-secondary" data-octor-page="/guides">Abrir biblioteca</a>
        <a class="library-link" data-octor-page="/manuals">Manual por URL</a>
      </div>
    </section>
  </div>

  <section id="manualStatusPanel" class="stats-card hidden"><h2>Manual automático</h2><p id="manualCaptureMessage" role="status"></p><button id="btnManualContinue" class="btn btn-primary hidden">Continuar coleta</button><button id="btnManualStop" class="btn btn-secondary hidden">Interromper coleta</button></section>
  <script src="environment.js"></script>
  <script src="dialogs.js"></script>
  <script src="popup.js"></script>
  <script src="playback-narration.js"></script>
</body>
</html>
