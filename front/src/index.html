<!doctype html>
<!-- Documento inicial da SPA. O elemento app-root é montado pelo bootstrap Angular; as telas são selecionadas pelo roteador. -->

<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>OCTOR - Criador e Editor de Guias</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    // Sincroniza as cores nativas antes do primeiro desenho; o CSS segue o sistema.
    // data-theme="light|dark", quando definido, tem prioridade sobre a preferência do SO.
    (() => {
      const root = document.documentElement;
      // Recupera apenas valores conhecidos antes de carregar a aplicação, sem flash de tema.
      try {
        const saved = localStorage.getItem('octor_theme');
        if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
      } catch { /* Usa a preferência do sistema quando o armazenamento não está disponível. */ }
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      const apply = () => {
        const explicit = root.getAttribute('data-theme');
        root.style.colorScheme = explicit === 'light' || explicit === 'dark'
          ? explicit : media.matches ? 'dark' : 'light';
      };
      apply();
      media.addEventListener('change', apply);
      new MutationObserver(apply).observe(root, {attributes: true, attributeFilter: ['data-theme']});
    })();
  </script>
  <link rel="preload" as="image" href="/assets/img/bg/tentaculo-light.png">
  <link rel="preload" as="image" href="/assets/img/bg/tentaculo-dark.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/brand/octor-favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/brand/octor-favicon-16.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 antialiased font-sans">
  <app-root></app-root>
</body>
</html>
