<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>AutoGuide Recorder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { width: 320px; background: #0f172a; color: #f8fafc; padding: 16px; font-size: 14px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .logo { font-size: 16px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #334155; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
    .status-badge.recording { background: #ef4444; color: #fff; animation: pulse 1.5s infinite; }
    .status-badge.paused { background: #f59e0b; color: #fff; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #334155;
      background: #1e293b; color: #fff; font-size: 13px; outline: none;
    }
    input:focus { border-color: #38bdf8; }
    
    .btn {
      width: 100%; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; display: flex; align-items: center; justify-content: center;
      gap: 6px; transition: all 0.2s;
    }
    .btn-primary { background: #0284c7; color: white; }
    .btn-primary:hover { background: #0369a1; }
    .btn-record { background: #ef4444; color: white; }
    .btn-record:hover { background: #dc2626; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-secondary:hover { background: #475569; }
    .btn-success { background: #10b981; color: white; }
    .btn-success:hover { background: #059669; }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .stats-card { background: #1e293b; border-radius: 8px; padding: 12px; margin-bottom: 14px; text-align: center; }
    .step-counter { font-size: 26px; font-weight: 700; color: #38bdf8; }
    .step-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }

    .error-msg { font-size: 12px; color: #f87171; margin-top: 6px; }
    .footer { margin-top: 14px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #64748b; }
    .link { color: #38bdf8; text-decoration: none; cursor: pointer; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">⚡ AutoGuide</div>
    <div id="statusBadge" class="status-badge">Pronto</div>
  </div>

  <!-- Tela de Login -->
  <div id="authSection" class="hidden">
    <div class="field">
      <label for="username">Usuário</label>
      <input type="text" id="username" placeholder="seu-usuario" />
    </div>
    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>
    <button id="btnLogin" class="btn btn-primary">Entrar</button>
    <div id="authError" class="error-msg hidden"></div>
  </div>

  <!-- Tela do Gravador -->
  <div id="recorderSection" class="hidden">
    <div class="stats-card">
      <div id="stepCounter" class="step-counter">0</div>
      <div class="step-label">Passos capturados</div>
    </div>

    <div id="setupControls">
      <div class="field">
        <label for="guideTitle">Título do Guia</label>
        <input type="text" id="guideTitle" placeholder="Ex: Criando nova fatura" value="Novo Guia" />
      </div>
      <button id="btnStart" class="btn btn-record">🔴 Iniciar Gravação</button>
    </div>

    <div id="activeControls" class="hidden">
      <div class="btn-row">
        <button id="btnPause" class="btn btn-secondary">⏸️ Pausar</button>
        <button id="btnFinish" class="btn btn-success">✅ Finalizar</button>
      </div>
    </div>

    <div id="recorderMsg" class="error-msg hidden"></div>

    <div class="footer">
      <span id="userInfo">Conectado</span>
      <span id="btnLogout" class="link">Sair</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
