services:
  postgres:
    image: postgres:16-alpine
    container_name: autoguide_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autoguide_db
      POSTGRES_USER: autoguide_user
      POSTGRES_PASSWORD: autoguide_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: autoguide_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
