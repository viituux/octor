# Serviços auxiliares locais: somente PostgreSQL e Redis; front/back/extensão não são executados por este Compose.
services:
  # Banco opcional: nomes e volume existentes são mantidos para não criar outra base na reorganização.
  postgres:
    image: postgres:16-alpine
    container_name: autoguide_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autoguide_db
      POSTGRES_USER: autoguide_user
      POSTGRES_PASSWORD: autoguide_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Broker de tarefas: o worker Celery é iniciado separadamente pelo interpretador do backend.
  redis:
    image: redis:7-alpine
    container_name: autoguide_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

# Volumes nomeados preservam os dados auxiliares entre reinicializações dos containers.
volumes:
  postgres_data:
  redis_data:
